[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leefee-video-downloader"
version = "2.0.0"
description = "Standalone video-download skill with verified outputs and optional browser extraction"
requires-python = ">=3.10"
dependencies = ["yt-dlp[default]>=2026.3.17"]
license = "MIT"

[project.optional-dependencies]
browser = ["playwright>=1.49"]
impersonation = ["curl-cffi>=0.10"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.scripts]
video-downloader = "videodl.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["videodl*"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
